
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>جزئیات محصول | فروشگاه امیر</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Tahoma,Arial,sans-serif;background:#f4f6fb;color:#172033}
header{background:#101a33;color:white;padding:18px 5%;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
a{text-decoration:none;color:inherit}
button{font:inherit;cursor:pointer}
.brand{font-size:22px;font-weight:bold}
.btn{border:0;border-radius:10px;padding:12px 16px;background:#315bd6;color:white;display:inline-block}
main{max-width:1000px;width:92%;margin:30px auto}
.back{display:inline-block;color:#315bd6;margin-bottom:18px}
.product{background:white;border-radius:18px;padding:24px;display:grid;grid-template-columns:1fr 1fr;gap:28px}
.photo{min-height:300px;background:#f7f8fc;border-radius:14px;display:flex;align-items:center;justify-content:center;padding:15px}
.photo img{width:100%;max-height:400px;object-fit:contain}
.info{display:flex;flex-direction:column;align-items:flex-start;gap:15px}
.category{background:#edf1ff;color:#315bd6;padding:7px 12px;border-radius:20px;font-size:13px}
h1{margin:0;font-size:30px}
.price{font-size:24px;color:#315bd6;font-weight:bold}
.description{line-height:2;color:#687386}
.note{background:#f4f6fb;padding:12px;border-radius:10px;line-height:1.9}
#message{color:#16804a;line-height:1.8}
footer{text-align:center;color:#687386;padding:25px}
@media(max-width:650px){.product{grid-template-columns:1fr;padding:15px}.photo{min-height:230px}.info{align-items:stretch}h1{font-size:25px}}
</style>
</head>
<body>
<header>
  <a class="brand" href="index.html">فروشگاه امیر</a>
  <a class="btn" href="index.html">بازگشت به فروشگاه</a>
</header>

<main>
  <a class="back" href="index.html">← بازگشت به محصولات</a>
  <section class="product" id="product"></section>
  <p id="message" aria-live="polite"></p>
</main>

<footer>فروشگاه امیر · نسخه آزمایشی</footer>

<script>
const PRODUCTS = [
  {
    id:"shoes",
    name:"کفش اسپرت",
    price:1500000,
    image:"images/shoes.jpg.jpg",
    category:"کفش",
    description:"کفش اسپرت مناسب استفاده روزمره با طراحی زیبا و راحت."
  },
  {
    id:"headphones",
    name:"هدفون",
    price:900000,
    image:"images/Clock.jpg.jpg",
    category:"هدفون",
    description:"هدفون مناسب گوش دادن به موسیقی و استفاده روزمره."
  },
  {
    id:"watch",
    name:"ساعت هوشمند",
    price:2200000,
    image:"images/amir.jpg.webp",
    category:"ساعت هوشمند",
    description:"ساعت هوشمند با طراحی مدرن و مناسب استفاده روزمره."
  }
];

const productId = new URLSearchParams(location.search).get("id");
const item = PRODUCTS.find(p => p.id === productId);
const container = document.getElementById("product");
const message = document.getElementById("message");
const CART_KEY = "amirStoreCart";

function money(n){
  return Number(n).toLocaleString("fa-IR") + " تومان";
}

function getCart(){
  try {
    const cart = JSON.parse(localStorage.getItem(CART_KEY) || "[]");
    return Array.isArray(cart) ? cart : [];
  } catch {
    return [];
  }
}

if (!item) {
  container.innerHTML = `
    <div>
      <h1>محصول پیدا نشد!</h1>
      <p class="description">این محصول وجود ندارد یا آدرس آن اشتباه است.</p>
      <a class="btn" href="index.html">مشاهده محصولات</a>
    </div>`;
} else {
  container.innerHTML = `
    <div class="photo">
      <img src="${item.image}" alt="${item.name}"
           onerror="this.style.display='none'">
    </div>
    <div class="info">
      <span class="category">${item.category}</span>
      <h1>${item.name}</h1>
      <div class="price">${money(item.price)}</div>
      <p class="description">${item.description}</p>
      <div class="note">
        این فروشگاه در حال حاضر نسخه آزمایشی است و پرداخت آنلاین واقعی ندارد.
      </div>
      <button class="btn" id="add">افزودن به سبد خرید</button>
      <a class="back" href="index.html">مشاهده سایر محصولات</a>
    </div>`;

  document.getElementById("add").addEventListener("click", () => {
    const cart = getCart();
    const existing = cart.find(p => p.id === item.id);

    if (existing) {
      existing.quantity = (Number(existing.quantity) || 1) + 1;
    } else {
      cart.push({
        id:item.id,
        name:item.name,
        price:item.price,
        quantity:1
      });
    }

    localStorage.setItem(CART_KEY, JSON.stringify(cart));
    message.textContent = "محصول به سبد خرید اضافه شد.";
  });
}
</script>
</body>
</html>
